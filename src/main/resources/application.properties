spring.application.name=estoque

# ==========================================================================
# Servidor
# ==========================================================================
server.port=${SERVER_PORT:8080}

# ==========================================================================
# PostgreSQL
# Os valores abaixo podem ser sobrescritos por variáveis de ambiente.
# Padrão para desenvolvimento local:
#   DB_URL=jdbc:postgresql://localhost:5432/estoque
#   DB_USER=postgres
#   DB_PASSWORD=postgres
# Assim ninguém precisa commitar senha no GitHub.
# ==========================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estoque}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================================
# JPA / Hibernate
# ddl-auto=update: o Hibernate cria/atualiza as tabelas a partir das entidades.
# ATENÇÃO do combinado da equipe: avise no grupo ao mudar uma entidade, porque
# isso altera o banco de todo mundo. Em um passo futuro, trocar por Flyway.
# ==========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================================
# JSON
# No Spring Boot 4 (Jackson 3) as datas java.time já saem no formato ISO-8601
# por padrão (ex.: "2026-11-20T21:10:00"). Campos nulos são omitidos.
# Observação: a propriedade antiga spring.jackson.serialization.
# write-dates-as-timestamps NÃO existe mais no Jackson 3 e derruba a aplicação
# na inicialização — não adicione.
# ==========================================================================
spring.jackson.default-property-inclusion=non_null
