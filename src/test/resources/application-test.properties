# ==========================================================================
# Perfil "test" — usado apenas nos testes automatizados (H2 em memória).
# O application.properties principal continua sendo carregado, então qualquer
# erro de configuração nele também aparece nos testes.
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:estoque_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
